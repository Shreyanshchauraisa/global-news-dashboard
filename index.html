<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Global News Intelligence Dashboard</title>
  <meta name="description" content="AI-summarized global news across every industry — updated daily." />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f8f6;
      --surface: #ffffff;
      --surface2: #f2f1ed;
      --border: rgba(0,0,0,0.1);
      --border2: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text2: #5a5a56;
      --text3: #9a9a94;
      --accent: #185FA5;
      --accent-bg: #E6F1FB;
      --accent-text: #185FA5;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --surface: #242422;
        --surface2: #2e2e2c;
        --border: rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.18);
        --text: #f0ede8;
        --text2: #a8a8a0;
        --text3: #686860;
        --accent: #5BA3E0;
        --accent-bg: #0C2A45;
        --accent-text: #7ABEED;
      }
    }

    html { font-family: var(--font); background: var(--bg); color: var(--text); }

    body { min-height: 100vh; }

    .topbar {
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-left .logo-icon { color: var(--accent); font-size: 20px; }
    .topbar-left h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .topbar-left span { font-size: 12px; color: var(--text3); }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .badge-live { background: #EAF3DE; color: #3B6D11; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; letter-spacing: 0.02em; }
    @media (prefers-color-scheme: dark) {
      .badge-live { background: #173404; color: #97C459; }
    }
    .last-upd { font-size: 11px; color: var(--text3); }

    .layout { display: flex; min-height: calc(100vh - 56px); }

    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 0.5px solid var(--border);
      padding: 1.25rem 1rem;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }
    .sidebar-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 8px; padding-left: 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: var(--radius-md);
      font-size: 13px; cursor: pointer; color: var(--text2);
      border: none; background: transparent; width: 100%; text-align: left;
      transition: all 0.12s;
    }
    .nav-item i { font-size: 15px; }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent-bg); color: var(--accent-text); font-weight: 500; }
    .sidebar-divider { height: 0.5px; background: var(--border); margin: 1rem 0; }
    .sub-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 6px; padding-left: 8px; }
    .sub-chip {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: 11px; cursor: pointer; border: 0.5px solid var(--border);
      background: transparent; color: var(--text2); margin: 3px 2px;
      transition: all 0.12s;
    }
    .sub-chip:hover { border-color: var(--border2); color: var(--text); }
    .sub-chip.active { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent); }

    .main { flex: 1; padding: 1.5rem 2rem; max-width: 900px; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .toolbar-left { font-size: 13px; color: var(--text3); }
    .toolbar-left strong { color: var(--text); }
    .refresh-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: var(--radius-md);
      border: 0.5px solid var(--border2); background: var(--surface);
      color: var(--text2); font-size: 12px; cursor: pointer; font-family: var(--font);
      transition: all 0.12s;
    }
    .refresh-btn:hover { background: var(--surface2); color: var(--text); }
    .refresh-btn i { font-size: 14px; }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .grid { display: flex; flex-direction: column; gap: 12px; }

    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.12s;
      display: flex;
      flex-direction: column;
    }
    .card:hover { border-color: var(--border2); }

    .card-img-wrap {
      width: 100%;
      height: 200px;
      overflow: hidden;
      background: var(--surface2);
      position: relative;
      flex-shrink: 0;
    }
    .card-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .card:hover .card-img-wrap img { transform: scale(1.03); }
    .card-img-wrap .img-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text3); font-size: 32px;
    }

    .card-body { padding: 1rem 1.25rem; display: flex; flex-direction: column; flex: 1; }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .card-badges { display: flex; gap: 5px; flex-wrap: wrap; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 500; }
    .badge-industry { background: var(--accent-bg); color: var(--accent-text); }
    .badge-sub { background: var(--surface2); color: var(--text2); }
    .card-time { font-size: 11px; color: var(--text3); white-space: nowrap; flex-shrink: 0; }
    .card h3 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; line-height: 1.45; }
    .card p { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 10px; flex: 1; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .source-link { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 500; }
    .source-link:hover { text-decoration: underline; }
    .source-name { font-size: 11px; color: var(--text3); }

    .state-box { text-align: center; padding: 4rem 2rem; color: var(--text2); }
    .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-box p { font-size: 14px; }
    .state-box small { font-size: 12px; color: var(--text3); display: block; margin-top: 6px; }

    .error-box {
      background: var(--surface2); border-radius: var(--radius-lg);
      padding: 2rem; text-align: center; font-size: 14px; color: var(--text2);
    }
    .error-box i { font-size: 28px; color: #E24B4A; display: block; margin-bottom: 8px; }

    @media (max-width: 700px) {
      .sidebar { display: none; }
      .main { padding: 1rem; }
      .topbar { padding: 0 1rem; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <i class="ti ti-world logo-icon" aria-hidden="true"></i>
    <h1>Global News Intelligence</h1>
    <span>/ AI-powered daily briefing</span>
  </div>
  <div class="topbar-right">
    <span class="badge-live">● LIVE</span>
    <span class="last-upd" id="lastUpd">Fetching...</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-label">Industries</div>
    <div id="industryNav"></div>

    <div class="sidebar-divider"></div>

    <div class="sub-label">Sub-filters</div>
    <div id="subNav"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="toolbar-left" id="countLabel">Loading news...</div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadNews()">
        <i class="ti ti-refresh" aria-hidden="true"></i> Refresh
      </button>
    </div>
    <div class="grid" id="newsGrid">
      <div class="state-box"><div class="spinner"></div><p>Fetching global headlines...</p></div>
    </div>
  </main>
</div>

<script>
const INDUSTRIES = [
  { id: 'all', label: 'All Industries', icon: 'ti-layout-grid' },
  { id: 'technology', label: 'Technology', icon: 'ti-cpu' },
  { id: 'finance', label: 'Finance', icon: 'ti-chart-line' },
  { id: 'healthcare', label: 'Healthcare', icon: 'ti-heart-rate-monitor' },
  { id: 'energy', label: 'Energy', icon: 'ti-bolt' },
  { id: 'geopolitics', label: 'Geopolitics', icon: 'ti-map-pin' },
  { id: 'retail', label: 'Retail & Consumer', icon: 'ti-shopping-bag' },
  { id: 'manufacturing', label: 'Manufacturing', icon: 'ti-building-factory' },
];

const SUBFILTERS = {
  all: ['AI', 'Finance', 'Technology', 'Regulatory', 'Markets', 'Climate', 'M&A', 'Startups'],
  technology: ['AI', 'Semiconductors', 'Cybersecurity', 'Cloud', 'Startups', 'Regulatory'],
  finance: ['Markets', 'Banking', 'Crypto', 'M&A', 'Regulatory', 'Central Banks'],
  healthcare: ['Biotech', 'Pharma', 'MedTech', 'Policy', 'Research'],
  energy: ['Oil & Gas', 'Renewables', 'Climate', 'Policy', 'Nuclear'],
  geopolitics: ['Trade', 'Sanctions', 'Conflict', 'Diplomacy', 'Elections'],
  retail: ['E-commerce', 'Consumer Trends', 'Supply Chain', 'Luxury', 'FMCG'],
  manufacturing: ['Automotive', 'Aerospace', 'Industrial', 'Supply Chain', 'Automation'],
};

let activeIndustry = 'all';
let activeSub = null;
let allArticles = [];
let isLoading = false;

function renderNav() {
  document.getElementById('industryNav').innerHTML = INDUSTRIES.map(ind => `
    <button class="nav-item ${activeIndustry === ind.id ? 'active' : ''}" onclick="selectIndustry('${ind.id}')">
      <i class="ti ${ind.icon}" aria-hidden="true"></i> ${ind.label}
    </button>
  `).join('');

  const subs = SUBFILTERS[activeIndustry] || [];
  document.getElementById('subNav').innerHTML = subs.map(s => `
    <button class="sub-chip ${activeSub === s ? 'active' : ''}" onclick="selectSub('${s}')">${s}</button>
  `).join('');
}

function selectIndustry(id) {
  activeIndustry = id;
  activeSub = null;
  renderNav();
  loadNews();
}

function selectSub(s) {
  activeSub = activeSub === s ? null : s;
  renderNav();
  filterAndRender();
}

function filterAndRender() {
  let articles = allArticles;
  if (activeSub) {
    articles = articles.filter(a => a.sub && a.sub.toLowerCase().includes(activeSub.toLowerCase()));
  }
  document.getElementById('countLabel').innerHTML = `<strong>${articles.length}</strong> article${articles.length !== 1 ? 's' : ''} found`;
  renderCards(articles);
}

function getImageUrl(article) {
  // Build a specific search query from the article keywords + timestamp to bust cache on refresh
  const keywords = (article.imageQuery || article.sub || article.industry || 'world news')
    .toLowerCase().replace(/[^a-z0-9 ]/g, '').trim().replace(/\s+/g, ',');
  const seed = Date.now() + Math.floor(Math.random() * 10000);
  return `https://source.unsplash.com/featured/800x400/?${encodeURIComponent(keywords)}&sig=${seed}`;
}

function renderCards(articles) {
  const grid = document.getElementById('newsGrid');
  if (!articles.length) {
    grid.innerHTML = '<div class="state-box"><p>No articles found for this filter. Try another.</p></div>';
    return;
  }
  grid.innerHTML = articles.map((a, i) => {
    const imgUrl = getImageUrl(a);
    return `
    <article class="card">
      <div class="card-img-wrap">
        <img
          src="${imgUrl}"
          alt="${a.title}"
          loading="${i < 3 ? 'eager' : 'lazy'}"
          onerror="this.style.display='none';this.parentElement.querySelector('.img-placeholder').style.display='flex'"
        />
        <div class="img-placeholder" style="display:none">
          <i class="ti ti-photo-off" aria-hidden="true"></i>
        </div>
      </div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-badges">
            <span class="badge badge-industry">${a.industry || activeIndustry}</span>
            ${a.sub ? `<span class="badge badge-sub">${a.sub}</span>` : ''}
          </div>
          <span class="card-time">${a.time || 'Today'}</span>
        </div>
        <h3>${a.title}</h3>
        <p>${a.summary}</p>
        <div class="card-footer">
          <a class="source-link" href="${a.url}" target="_blank" rel="noopener noreferrer">
            <i class="ti ti-external-link" aria-hidden="true"></i> Read full story
          </a>
          <span class="source-name">${a.source}</span>
        </div>
      </div>
    </article>
  `}).join('');
}

async function loadNews() {
  if (isLoading) return;
  isLoading = true;
  document.getElementById('refreshBtn').disabled = true;
  document.getElementById('newsGrid').innerHTML = '<div class="state-box"><div class="spinner"></div><p>Fetching latest global headlines...</p></div>';
  document.getElementById('countLabel').innerHTML = 'Loading...';

  const industryLabel = INDUSTRIES.find(i => i.id === activeIndustry)?.label || 'all industries';
  const subLabel = activeSub ? ` focused on ${activeSub}` : '';
  const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

  const prompt = `Today is ${today}. You are a global news intelligence analyst. Use web search to find 8 important recent news stories from ${industryLabel}${subLabel}.

For each story return a JSON array with these exact keys:
- title: punchy headline (max 12 words)
- summary: 2-3 sentence plain-English summary of what happened and why it matters
- industry: one of [Technology, Finance, Healthcare, Energy, Geopolitics, Retail, Manufacturing]
- sub: one relevant sub-tag from [AI, Finance, Technology, Regulatory, Markets, Climate, M&A, Startups, Semiconductors, Cybersecurity, Cloud, Banking, Crypto, Central Banks, Biotech, Pharma, MedTech, Oil & Gas, Renewables, Nuclear, Trade, Sanctions, Conflict, Diplomacy, Elections, E-commerce, Supply Chain, Automotive, Aerospace, Industrial]
- source: publication name (e.g. Reuters, Bloomberg, FT)
- url: real working URL to the article
- time: relative time like "2 hours ago" or "Today"
- imageQuery: 2-3 specific keywords for an Unsplash photo that visually represents this story (e.g. "stock market trading floor", "semiconductor chip factory", "wind turbines ocean")

Return ONLY a valid JSON array, no markdown, no explanation, no backticks.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) throw new Error(`API error: ${response.status}`);

    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const clean = textBlocks.replace(/```json|```/g, '').trim();
    const start = clean.indexOf('[');
    const end = clean.lastIndexOf(']');
    if (start === -1) throw new Error('No JSON returned from API');
    const articles = JSON.parse(clean.slice(start, end + 1));
    allArticles = articles;
    filterAndRender();

    const now = new Date();
    document.getElementById('lastUpd').textContent = `Updated ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  } catch (err) {
    document.getElementById('newsGrid').innerHTML = `
      <div class="error-box">
        <i class="ti ti-alert-circle" aria-hidden="true"></i>
        Could not load news. Check your API key in the URL or try refreshing.
        <small>${err.message}</small>
      </div>`;
    document.getElementById('countLabel').innerHTML = 'Error loading articles';
  }

  isLoading = false;
  document.getElementById('refreshBtn').disabled = false;
}

renderNav();
loadNews();
</script>
</body>
</html>
